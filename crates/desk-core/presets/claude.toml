description = "Claude Code"
program = "claude"
args = ["-p", "--output-format", "stream-json", "--verbose", "--add-dir", "{workspace}"]
model_args = ["--model", "{model}"]
bypass = ["--permission-mode", "bypassPermissions"]
system = ["--append-system-prompt-file", "{role_file}"]
session = "stream"
resume = ["--resume", "{session}"]
output = "claude"
interactive = ["claude", "--model", "{model}"]
models = ["sonnet", "opus", "haiku"]
# Shown under the input box only when Claude Code is waiting for a message:
# the first in the default permission mode, the second in the others (bypass,
# accept edits, plan), where it replaces the first.
ready = ["? for shortcuts", "shift+tab to cycle"]

# Use your claude.ai login, not an API key that happens to be set.
# Delete this line (in a copy under the workspace's presets/) to bill the key instead.
# Started from inside a Claude Code session, Claude would also see itself as
# a child session and not save transcripts, so `--resume` would find nothing.
env = { ANTHROPIC_API_KEY = "", CLAUDE_CODE_CHILD_SESSION = "" }
