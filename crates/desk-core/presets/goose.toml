# Flags from `goose run --help` (1.54); not yet run by desk. desk names the
# session, so later runs resume it. The model comes from goose's own config
# unless the agent sets one.
description = "goose (untested)"
program = "goose"
args = ["run", "--instructions", "-", "--name", "{session}"]
model_args = ["--model", "{model}"]
session = "named"
resume = ["--resume"]
output = "text"
interactive = ["goose", "session", "--name", "{session}"]
