# Flags from `zcode --help` (0.17); not yet run by desk. zcode takes its prompt
# as an argument, so desk writes it to a file and points zcode at it.
description = "ZCode, Z.AI's CLI (untested)"
program = "zcode"
args = ["-p", "Read {prompt_file} and do what it says."]
model_args = ["--model", "{model}"]
bypass = ["--mode", "yolo"]
session = "none"
output = "text"
interactive = ["zcode"]
