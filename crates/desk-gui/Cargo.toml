[package]
name = "desk-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
desk-core = { workspace = true, features = ["terminal"] }
anyhow.workspace = true
chrono.workspace = true
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
rfd = "0.17"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
notify-rust = "4.18"
